name: Проверка кода

# Запускается на каждое изменение в основной ветке и на каждый запрос слияния.
# Смысл: не давать накапливаться сломанному состоянию. Даже при работе
# в одиночку это экономит время — ошибка обнаруживается там, где сделана,
# а не через две недели при попытке собрать всё вместе.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Новый запуск отменяет предыдущий для той же ветки: проверять устаревший
# код бессмысленно, а ресурсы расходуются.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────
  # Проверка исходного кода: оформление, правила, типы, тесты.
  # Здесь же срабатывает правило зависимостей между слоями —
  # обращение из домена к инфраструктуре остановит сборку.
  # ─────────────────────────────────────────────────────────────
  quality:
    name: Оформление, правила и тесты
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Установка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Проверка оформления
        run: npm run format:check

      - name: Проверка правил кода
        run: npm run lint

      - name: Сборка
        run: npm run build

      # Клиентское приложение — проверка типов и сборка. Без этого шага
      # страница, на которую ссылается маршрут, могла отсутствовать,
      # и конвейер оставался зелёным.
      - name: Сборка клиентского приложения
        run: npm run build -w @food-delivery/web

      - name: Тесты
        run: npm test

      - name: Отчёт о покрытии
        run: npm run test:cov

      - name: Сохранение отчёта о покрытии
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            packages/*/coverage/
            apps/*/coverage/
          retention-days: 7
          if-no-files-found: ignore

  # ─────────────────────────────────────────────────────────────
  # Проверка миграций на чистой базе.
  #
  # Отдельная задача, потому что проверяет другое: не код, а то,
  # что структура базы восстанавливается с нуля одной командой.
  # Миграция, работающая на уже наполненной базе разработчика,
  # вполне может не работать на пустой.
  # ─────────────────────────────────────────────────────────────
  migrations:
    name: Миграции на чистой базе
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Создание баз сервисов
        run: |
          for db in catalog_db order_db payment_db delivery_db; do
            PGPASSWORD=app psql -h localhost -U app -d app -c "CREATE DATABASE $db"
            PGPASSWORD=app psql -h localhost -U app -d "$db" -c "CREATE EXTENSION IF NOT EXISTS postgis"
            PGPASSWORD=app psql -h localhost -U app -d "$db" -c 'CREATE EXTENSION IF NOT EXISTS "uuid-ossp"'
          done

      - name: Применение миграций
        run: npm run db:migrate

      - name: Повторное применение не должно ничего менять
        run: |
          output=$(npm run db:migrate 2>&1)
          echo "$output"
          if echo "$output" | grep -q "применена"; then
            echo "ОШИБКА: повторный запуск миграций изменил базу"
            exit 1
          fi

      - name: Наполнение тестовыми данными
        run: npm run db:seed

      # Хранилище заказов проверяется на настоящей СУБД: оптимистичная
      # блокировка, уникальный ключ идемпотентности, отметки обработанных
      # сообщений и аренда шагов саги — свойства SQL, а не кода приложения.
      - name: Интеграционные тесты заказов на PostgreSQL
        env:
          ORDER_DB: order_verify_db
          MIGRATION_SERVICE: order
          ORDER_INTEGRATION_DB_URL: postgres://app:app@localhost:5432/order_verify_db
        run: |
          PGPASSWORD=app psql -h localhost -U app -d app -c "CREATE DATABASE order_verify_db"
          PGPASSWORD=app psql -h localhost -U app -d order_verify_db -c "CREATE EXTENSION IF NOT EXISTS postgis"
          npm run db:migrate
          # Типы общих пакетов берутся из их сборки (dist): без неё проверка
          # типов в тестах не находит @food-delivery/contracts.
          npm run build -w @food-delivery/shared
          npm run build -w @food-delivery/contracts
          npm run build -w @food-delivery/service-kit
          npm test -w @food-delivery/order -- order.integration

      # Идемпотентность платежей держат уникальные индексы и завершение
      # операции под блокировкой: двадцать одновременных повторов холда
      # и списания проверяются на настоящей СУБД (PAY-4).
      - name: Интеграционные тесты платежей на PostgreSQL
        env:
          PAYMENT_DB: payment_verify_db
          MIGRATION_SERVICE: payment
          PAYMENT_INTEGRATION_DB_URL: postgres://app:app@localhost:5432/payment_verify_db
        run: |
          PGPASSWORD=app psql -h localhost -U app -d app -c "CREATE DATABASE payment_verify_db"
          npm run db:migrate
          npm test -w @food-delivery/payment -- payment.integration

      # Подбор курьера держат пространственный индекс и блокировки строк:
      # ближайший в радиусе, один курьер — одному заказу, таймер в базе (DLV-3, DLV-4).
      - name: Интеграционные тесты доставки на PostgreSQL + PostGIS
        env:
          DELIVERY_DB: delivery_verify_db
          MIGRATION_SERVICE: delivery
          DELIVERY_INTEGRATION_DB_URL: postgres://app:app@localhost:5432/delivery_verify_db
        run: |
          PGPASSWORD=app psql -h localhost -U app -d app -c "CREATE DATABASE delivery_verify_db"
          PGPASSWORD=app psql -h localhost -U app -d delivery_verify_db -c "CREATE EXTENSION IF NOT EXISTS postgis"
          npm run db:migrate
          npm test -w @food-delivery/delivery -- delivery.integration

      - name: Проверка географического запроса
        run: |
          PGPASSWORD=app psql -h localhost -U app -d catalog_db -tAc "
            SELECT CASE WHEN count(*) > 0
                   THEN 'геозапрос вернул ' || count(*) || ' ресторанов'
                   ELSE 'ОШИБКА: геозапрос ничего не нашёл' END
            FROM delivery_zones z JOIN restaurants r ON r.id = z.restaurant_id
            WHERE ST_Contains(z.area::geometry,
                              ST_SetSRID(ST_MakePoint(37.6176, 55.7558), 4326)::geometry)
              AND r.is_active" | tee result.txt
          grep -q "ОШИБКА" result.txt && exit 1 || true

  # ─────────────────────────────────────────────────────────────
  # Сборка образов. Проверяет то, чего не видят предыдущие задачи:
  # собирается ли сервис в контейнере, где нет ни кэша, ни лишних файлов.
  # ─────────────────────────────────────────────────────────────
  images:
    name: Сборка образов
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality

    strategy:
      fail-fast: false
      matrix:
        service: [gateway, catalog, order, payment, delivery]

    steps:
      - uses: actions/checkout@v4

      # Кэш слоёв в GitHub Actions (type=gha) поддерживает только сборщик buildx;
      # стандартный драйвер Docker отказывается экспортировать кэш, и сборка падает.
      - name: Подготовка сборщика образов
        uses: docker/setup-buildx-action@v3

      - name: Сборка образа ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          push: false
          tags: food-delivery/${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
