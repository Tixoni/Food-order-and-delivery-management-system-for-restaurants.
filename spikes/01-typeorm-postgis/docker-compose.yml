services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: spike-postgis
    environment:
      POSTGRES_USER: spike
      POSTGRES_PASSWORD: spike
      POSTGRES_DB: spike
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spike -d spike"]
      interval: 3s
      timeout: 3s
      retries: 20
