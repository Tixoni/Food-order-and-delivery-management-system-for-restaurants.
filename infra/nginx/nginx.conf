# Обратный прокси прототипа (SCAL-2).
#
# 8080 — единственный открытый вход: клиентское приложение (статика),
#        GraphQL с подписками по WebSocket и вход /auth — на реплики шлюза.
# 8081 — только внутри сети: балансировка каталога для шлюза и order.
#        В целевой схеме эту роль выполняет Service кластера.
#
# Реплики равноправны и не держат состояния в памяти: сессии — в токенах,
# кэш и счётчики — в Redis, события — у каждого экземпляра свои (шлюз).
# Поэтому привязка клиента к реплике (sticky sessions) не нужна, и
# отказ реплики виден клиенту только как переподключение WebSocket.

worker_processes auto;

events {
  # Каждое соединение WebSocket занимает два: от клиента и к шлюзу.
  worker_connections 4096;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  server_tokens off;

  # Встроенный DNS Docker. Перезапущенный контейнер может получить новый
  # адрес — `resolve` у серверов upstream перечитывает его без перезапуска
  # прокси (nginx ≥ 1.27.3).
  resolver 127.0.0.11 valid=5s ipv6=off;

  log_format edge '$remote_addr "$request" $status $request_time '
                  'upstream=$upstream_addr status=$upstream_status time=$upstream_response_time';
  access_log /dev/stdout edge;
  error_log /dev/stderr warn;

  # Реплика, трижды не ответившая на соединение, выводится из ротации на
  # 5 с. Не с первого раза: только что запущенная реплика несколько секунд
  # отказывает в соединении, пока приложение загружается, — запрос при этом
  # уходит на другую. При пороге 1 такой отказ выключал реплику, и если
  # вторая в эти секунды отказывала аварийно, живых реплик не оставалось
  # (найдено проверкой scal2-replicas).
  #
  # Постоянных соединений к репликам нет (нет `keepalive`) — сознательно.
  # Аварийно остановленный контейнер не закрывает соединения: пакеты к нему
  # просто пропадают, и запрос по такому «мёртвому» соединению ждал бы до
  # конца таймаута ответа. С новым соединением на каждый запрос отказ
  # виден сразу при подключении, а запрос, который до реплики не дошёл,
  # безопасно повторяется на другой — даже изменяющий (POST). Цена —
  # установка TCP-соединения внутри одной машины, доли миллисекунды.
  upstream gateway {
    zone gateway 64k;
    server gateway:3000 resolve max_fails=3 fail_timeout=5s;
    server gateway-2:3000 resolve max_fails=3 fail_timeout=5s;
  }

  upstream catalog {
    zone catalog 64k;
    server catalog:3001 resolve max_fails=3 fail_timeout=5s;
    server catalog-2:3001 resolve max_fails=3 fail_timeout=5s;
  }

  server {
    listen 8080;
    root /usr/share/nginx/html;

    # Внутри одной сети соединение устанавливается за доли миллисекунды;
    # нет ответа за секунду — реплики нет, пробуем другую.
    proxy_connect_timeout 1s;
    proxy_set_header Host $host;
    # Настоящий адрес клиента дописывается в конец; шлюз верит ровно
    # одному звену справа (TRUST_PROXY_HOPS=1) — подделка левее не поможет.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Трасса начинается на шлюзе: контекст трассы от клиента не принимается,
    # иначе снаружи можно было бы подмешивать участки в чужие трассы (OBS-2).
    proxy_set_header traceparent "";
    proxy_set_header tracestate "";
    # Повтор на другой реплике — если запрос до первой не дошёл (отказ
    # соединения) или она ответила «недоступен». Запрос, который реплика
    # уже получила, повторно не отправляется: изменение не выполнится дважды.
    proxy_next_upstream error timeout http_502 http_503;
    proxy_next_upstream_tries 2;

    location = /healthz {
      access_log off;
      return 200 "ok\n";
    }

    # Файлы сборки с хэшем в имени — кэшируются надолго.
    location /assets/ {
      expires 1y;
      add_header Cache-Control "public, immutable";
      try_files $uri =404;
    }

    # Маршруты одностраничного приложения — на index.html.
    location / {
      add_header Cache-Control "no-cache";
      try_files $uri /index.html;
    }

    # Запросы и изменения GraphQL. Подписки (WebSocket) — отдельно ниже:
    # им нужен часовой таймаут, обычному запросу — нет.
    location = /graphql {
      if ($http_upgrade ~* "^websocket$") {
        rewrite ^ /graphql-ws last;
      }
      proxy_pass http://gateway;
      proxy_http_version 1.1;
      proxy_read_timeout 30s;
    }

    location = /graphql-ws {
      internal;
      proxy_pass http://gateway/graphql;
      proxy_http_version 1.1;
      # Свои заголовки отменяют унаследованные — повторяем общие.
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header traceparent "";
      proxy_set_header tracestate "";
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      # Подписки живут часами; разрыв по простою не нужен.
      proxy_read_timeout 1h;
      proxy_send_timeout 1h;
    }

    location /auth/ {
      proxy_pass http://gateway;
      proxy_http_version 1.1;
      proxy_read_timeout 30s;
    }
  }

  server {
    listen 8081;

    location / {
      proxy_pass http://catalog;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      # Шлюз ждёт каталог 3 с: прокси должен успеть и обнаружить отказ
      # реплики, и получить ответ от другой.
      proxy_connect_timeout 500ms;
      proxy_read_timeout 2s;
      proxy_next_upstream error timeout http_502 http_503;
      proxy_next_upstream_tries 2;
    }
  }
}
