name: food-delivery

# Окружение разработки.
#
# Профили позволяют поднимать только то, что нужно прямо сейчас:
#   core  — база, кэш, брокер: повседневная разработка
#   auth  — плюс провайдер идентификации
#   apps  — инфраструктура плюс сами сервисы в контейнерах
#   full  — всё сразу: демонстрация и нагрузочное тестирование
#
# Запуск:  npm run env:up          (профиль core)
#          npm run env:up:full
#
# Профили observability и geo добавляются в итерации 4 вместе
# с соответствующими компонентами.
#
# ВАЖНО: порты публикуются в диапазоне 1xxxx, а не в стандартных 5432/6379/9092.
# Причина — на машине разработчика может быть установлена своя PostgreSQL
# или Redis. Windows допускает двух слушателей на одном порту, соединение
# достаётся тому, кто встал первым, и ошибка выглядит как неверный пароль.
# Нестандартные порты снимают этот класс проблем целиком.
#
# Диапазон 1xxxx выбран намеренно: Windows резервирует под свои нужды
# участки в диапазоне 50000-60000 (см. netsh ... show excludedportrange),
# и порт оттуда может внезапно перестать открываться.

services:
  # ─────────────────────────────────────────────────────────────
  # PostgreSQL с географическим расширением.
  # Держит четыре логические базы — по одной на сервис.
  # ─────────────────────────────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4
    container_name: fd-postgres
    profiles: ["core", "auth", "apps", "full"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
      # Ускоряет первичную инициализацию, на реальные данные не влияет
      POSTGRES_INITDB_ARGS: "--data-checksums"
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # ─────────────────────────────────────────────────────────────
  # Redis: корзина, кэш каталога, позиции курьеров, ограничение частоты.
  # Данные эфемерные — потеря при перезапуске допустима.
  # ─────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: fd-redis
    profiles: ["core", "auth", "apps", "full"]
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--appendonly",
        "no",
        "--maxmemory",
        "256mb",
        "--maxmemory-policy",
        "allkeys-lru",
      ]
    ports:
      - "${REDIS_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ─────────────────────────────────────────────────────────────
  # Apache Kafka в режиме KRaft — без отдельного ZooKeeper.
  # Именно этот режим даёт расход памяти около 300 МБ вместо 1,5 ГБ
  # у старой связки (измерено, заметка «30 — Спайк 3»).
  # ─────────────────────────────────────────────────────────────
  kafka:
    image: apache/kafka:3.9.0
    container_name: fd-kafka
    profiles: ["core", "auth", "apps", "full"]
    restart: unless-stopped
    ports:
      - "${KAFKA_PORT:-19092}:19092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Два слушателя вместо одного. Причина: брокер сообщает клиенту адрес,
      # по которому к нему следует обращаться, и этот адрес обязан быть
      # верным с точки зрения клиента. Для сервиса в общей сети это
      # kafka:9092, для программы на машине разработчика — localhost:19092.
      # С одним слушателем один из двух случаев перестаёт работать.
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_PORT:-19092}
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168
      CLUSTER_ID: food-delivery-local-cluster
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9092'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  # ─────────────────────────────────────────────────────────────
  # Keycloak: вход и роли. Поднимается только по необходимости —
  # это самый тяжёлый компонент после базы.
  # ─────────────────────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: fd-keycloak
    # Профиль apps добавлен на шаге 1.4: с этого момента сервисы проверяют
    # права на каждом запросе, и без провайдера входа система неработоспособна.
    profiles: ["auth", "apps", "full"]
    restart: unless-stopped
    # Область со всеми ролями и учётными записями создаётся из файла,
    # а не руками через веб-интерфейс: настройка прав должна быть
    # воспроизводимой и лежать в репозитории рядом с кодом.
    command: ["start-dev", "--http-port=8080", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
      # Публичный адрес провайдера: из него строятся ссылки в письмах
      # (AUTH-1) и поле издателя токенов. Без него ссылка подтверждения
      # вела бы на keycloak:8080 — имя, известное только внутри сети
      # контейнеров. Сервисы при этом ходят к провайдеру по внутреннему
      # адресу (KEYCLOAK_INTERNAL_URL), и он отвечает им по нему же.
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-18080}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "${KEYCLOAK_PORT:-18080}:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ../keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      # В образе нет curl, поэтому проверяется само наличие слушателя.
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8080'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # ─────────────────────────────────────────────────────────────
  # Почтовый сервер-ловушка: принимает письма провайдера входа
  # (подтверждение e-mail, AUTH-1) и никуда их не отправляет.
  # Письма видны в веб-интерфейсе и доступны сценарию проверки по API.
  # ─────────────────────────────────────────────────────────────
  mailpit:
    image: axllent/mailpit:v1.20.4
    container_name: fd-mailpit
    profiles: ["auth", "apps", "full"]
    restart: unless-stopped
    ports:
      - "${MAILPIT_UI_PORT:-18025}:8025"
      - "${MAILPIT_SMTP_PORT:-11025}:1025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ─────────────────────────────────────────────────────────────
  # Сервис каталога. Профиль apps — чтобы при разработке можно было
  # поднять только инфраструктуру, а сам сервис запускать локально
  # с пересборкой на лету.
  # ─────────────────────────────────────────────────────────────
  catalog:
    build:
      context: ../..
      dockerfile: apps/catalog/Dockerfile
    image: food-delivery/catalog:local
    container_name: fd-catalog
    profiles: ["apps", "full"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CATALOG_PORT: 3001
      # Внутри общей сети обращение идёт по имени сервиса и внутреннему порту,
      # а не по localhost и опубликованному порту.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      CATALOG_DB: ${CATALOG_DB:-catalog_db}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BROKERS: kafka:9092
      # Издатель токенов — публичный адрес провайдера (KC_HOSTNAME), ключи
      # подписи сервис забирает по внутреннему: из контейнера localhost —
      # это сам контейнер. При запуске сервисов на машине разработчика
      # внутренний адрес не нужен — оба совпадают.
      KEYCLOAK_ISSUER: http://localhost:${KEYCLOAK_PORT:-18080}/realms/food-delivery
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080/realms/food-delivery
      AUTH_AUDIENCE: food-delivery-api
    ports:
      - "${CATALOG_PORT:-13001}:3001"

  gateway:
    build:
      context: ../..
      dockerfile: apps/gateway/Dockerfile
    image: food-delivery/gateway:local
    container_name: fd-gateway
    profiles: ["apps", "full"]
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      GATEWAY_PORT: 3000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BROKERS: kafka:9092
      KEYCLOAK_ISSUER: http://localhost:${KEYCLOAK_PORT:-18080}/realms/food-delivery
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080/realms/food-delivery
      AUTH_AUDIENCE: food-delivery-api
      AUTH_CLIENT_ID: web
      AUTH_ADMIN_CLIENT_ID: gateway-admin
      AUTH_ADMIN_CLIENT_SECRET: ${AUTH_ADMIN_CLIENT_SECRET:-gateway-admin-dev-secret}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:5173}
      CATALOG_URL: http://catalog:3001
    ports:
      - "${GATEWAY_PORT:-13000}:3000"

  # Сервис заказов: автомат статусов, оркестратор саги, таймеры, корзина.
  # Платежи и доставка до их реализации — заглушки внутри процесса
  # (PAYMENT_MODE / DELIVERY_MODE = stub). Платежи с итерации 2 — настоящий
  # сервис `payment` (PAYMENT_MODE=http); отказы для проверки компенсаций
  # включаются у эмулятора провайдера: POST /_emulator/settings.
  order:
    build:
      context: ../..
      dockerfile: apps/order/Dockerfile
    image: food-delivery/order:local
    container_name: fd-order
    profiles: ["apps", "full"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ORDER_PORT: 3002
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      ORDER_DB: ${ORDER_DB:-order_db}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BROKERS: kafka:9092
      KEYCLOAK_ISSUER: http://localhost:${KEYCLOAK_PORT:-18080}/realms/food-delivery
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080/realms/food-delivery
      AUTH_AUDIENCE: food-delivery-api
      CATALOG_URL: http://catalog:3001
      PAYMENT_MODE: ${PAYMENT_MODE:-http}
      PAYMENT_URL: http://payment:3003
      PAYMENT_INTERNAL_TOKEN: ${PAYMENT_INTERNAL_TOKEN:-payment-internal-dev-token}
      DELIVERY_MODE: ${DELIVERY_MODE:-stub}
      DELIVERY_URL: http://delivery:3004
      PAYMENT_STUB_FAIL_OPERATION: ${PAYMENT_STUB_FAIL_OPERATION:-}
    ports:
      - "${ORDER_PORT:-13002}:3002"

  payment:
    build:
      context: ../..
      dockerfile: apps/payment/Dockerfile
    image: food-delivery/payment:local
    container_name: fd-payment
    profiles: ["apps", "full"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      payment-provider:
        condition: service_healthy
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PAYMENT_PORT: 3003
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      PAYMENT_DB: ${PAYMENT_DB:-payment_db}
      KAFKA_BROKERS: kafka:9092
      PAYMENT_INTERNAL_TOKEN: ${PAYMENT_INTERNAL_TOKEN:-payment-internal-dev-token}
      PROVIDER_URL: http://payment-provider:3010
      PROVIDER_SHOP_ID: ${PROVIDER_SHOP_ID:-food-delivery-shop}
      PROVIDER_SECRET_KEY: ${PROVIDER_SECRET_KEY:-test_provider_dev_secret}
      # Учебный стенд работает с учебными секретами; в рабочем окружении
      # сервис без собственных секретов не запустится.
      ALLOW_DEV_SECRETS: ${ALLOW_DEV_SECRETS:-true}
    ports:
      - "${PAYMENT_PORT:-13003}:3003"

  # ─────────────────────────────────────────────────────────────
  # Эмулятор платёжного провайдера (контракт ЮKassa). Тот же образ,
  # что у сервиса платежей, другая команда. Отказы, задержки и отклонения
  # банка включаются на лету: POST http://localhost:13010/_emulator/settings.
  # Остановка контейнера изображает недоступность провайдера (REL-2).
  # ─────────────────────────────────────────────────────────────
  payment-provider:
    image: food-delivery/payment:local
    container_name: fd-payment-provider
    profiles: ["apps", "full"]
    restart: unless-stopped
    command: ["node", "apps/payment/dist/provider-emulator/main.js"]
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      EMULATOR_PORT: 3010
      PROVIDER_SHOP_ID: ${PROVIDER_SHOP_ID:-food-delivery-shop}
      PROVIDER_SECRET_KEY: ${PROVIDER_SECRET_KEY:-test_provider_dev_secret}
    ports:
      - "${PROVIDER_PORT:-13010}:3010"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3010/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  delivery:
    build:
      context: ../..
      dockerfile: apps/delivery/Dockerfile
    image: food-delivery/delivery:local
    container_name: fd-delivery
    profiles: ["apps", "full"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DELIVERY_PORT: 3004
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      DELIVERY_DB: ${DELIVERY_DB:-delivery_db}
    ports:
      - "${DELIVERY_PORT:-13004}:3004"

volumes:
  postgres-data:
  kafka-data:
  keycloak-data:
